name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.10"
        miniforge-variant: Miniforge3
        use-mamba: true
    
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        mamba install -y -c conda-forge \
          openmm \
          pdbfixer \
          rdkit \
          openff-toolkit \
          openmmforcefields \
          mdtraj \
          numpy \
          requests
        pip install pytest pytest-mock responses paramiko streamlit
    
    - name: Shell script syntax check
      run: |
        for f in batch_wp.sh run_wp.sh setup_wp.sh run_ui.sh \
                 test_wp.sh test_pipeline.sh scripts/demo.sh westpa_template/env.sh; do
          echo "Checking $f..."
          bash -n "$f"
        done
        echo "All shell scripts pass syntax check"
    
    - name: Run smoke test
      shell: bash -l {0}
      run: |
        ./scripts/demo.sh
    
    - name: Run pytest
      shell: bash -l {0}
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Verify smoke test passed
      shell: bash -l {0}
      run: |
        if [ $? -ne 0 ]; then
          echo "Smoke test failed"
          exit 1
        fi
        echo "Smoke test passed"
